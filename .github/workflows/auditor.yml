name: Auditoria narrativa opcional

on:
  workflow_dispatch:

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Configurar o Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Google GenAI SDK
        run: pip install --disable-pip-version-check google-genai

      - name: Rodar auditoria narrativa opcional
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python auditor.py
